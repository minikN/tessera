name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
            skip: host-darwin-
          - os: macos-latest
            system: aarch64-darwin
            skip: host-nixos-
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: tessera
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # One process per check; each job evaluates on its own host checks
      - run: |
          nix eval --json .#checks.${{ matrix.system }} --apply builtins.attrNames \
            | jq -r '.[] | select(startswith("${{ matrix.skip }}") | not)' \
            | xargs -P 4 -I {} nix build --no-link --no-eval-cache -L '.#checks.${{ matrix.system }}.{}'
